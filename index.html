<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample Production Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:white;padding:18px;font-size:20px;font-weight:800}main{max-width:900px;margin:auto;padding:16px}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.nav button{padding:11px;border:0;border-radius:10px;font-weight:700}.primary{background:#2563eb;color:white}.card,.panel{background:white;border:1px solid #e5e9f0;border-radius:14px;padding:16px;margin-bottom:14px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{font-size:28px;font-weight:800}.muted{color:#687386;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #d8dee8;border-radius:9px;box-sizing:border-box;font:inherit}.color{border:1px solid #e5e9f0;border-radius:12px;padding:12px;margin:12px 0}.danger{background:#fee2e2;color:#991b1b;border:0;padding:9px;border-radius:9px}.view{display:none}.view.active{display:block}.search{width:100%;padding:12px;border:1px solid #d8dee8;border-radius:10px;box-sizing:border-box}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.tablewrap{overflow:auto}.notice{padding:10px;background:#eff6ff;border-radius:10px;font-size:13px;margin-bottom:12px}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>Sample Production Manager</header>
<main>
<div class="nav">
<button class="primary" onclick="view('dashboard')">Dashboard</button>
<button onclick="view('new')">＋ New Booking</button>
<button onclick="view('bookings')">Bookings</button>
<button onclick="view('settings')">⚙ Settings</button>
</div>

<section id="dashboard" class="view active">
<div class="notice" id="notice">Connect your Supabase project in Settings.</div>
<div class="cards">
<div class="card"><div class="metric" id="total">—</div><div class="muted">Total bookings</div></div>
<div class="card"><div class="metric" id="active">—</div><div class="muted">Active</div></div>
<div class="card"><div class="metric" id="delivered">—</div><div class="muted">Delivered</div></div>
<div class="card"><div class="metric" id="colors">—</div><div class="muted">Production colors</div></div>
</div>
</section>

<section id="new" class="view">
<div class="panel">
<h2>New Booking</h2>
<div class="grid">
<div class="field"><label>Int Ref *</label><input id="ref"></div>
<div class="field"><label>Buyer *</label><select id="buyer"><option>Select buyer</option></select></div>
<div class="field"><label>Style</label><input id="style"></div>
<div class="field"><label>Sample Type</label><select id="sample"><option>PP Sample</option><option>Development Sample</option><option>Other</option></select></div>
<div class="field"><label>Booking Date</label><input id="date" type="date"></div>
</div>
<h3>Colors</h3><div id="colorList"></div>
<button onclick="addColor()">＋ Add Color</button>
<p><button class="primary" onclick="saveBooking()">Save Booking</button></p>
<div id="msg" class="muted"></div>
</div>
</section>

<section id="bookings" class="view">
<div class="panel"><h2>Bookings</h2><input class="search" id="search" placeholder="Search Int Ref, buyer, style or color" oninput="render()"><div class="tablewrap" id="table"></div></div>
</section>

<section id="settings" class="view">
<div class="panel"><h2>Supabase Connection</h2>
<div class="notice">Use your Project URL and Publishable key. Never enter a Secret key.</div>
<div class="field"><label>Project URL</label><input id="url" placeholder="https://xxxxx.supabase.co"></div><br>
<div class="field"><label>Publishable key</label><input id="key" type="password" placeholder="sb_publishable_..."></div><br>
<button class="primary" onclick="connect()">Save & Connect</button>
<div id="setmsg" class="muted"></div>
</div>
</section>
</main>

<script>
let db=null, rows=[], n=0;
const $=x=>document.getElementById(x);
function view(x){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(x).classList.add('active');if(x==='bookings')load();}
function addColor(){
 n++;
 let d=document.createElement('div');d.className='color';d.id='c'+n;
 d.innerHTML='<div class="grid">'+
 '<div class="field"><label>Color *</label><input class="clr"></div>'+
 '<div class="field"><label>Body Fabric</label><input class="bf"></div>'+
 '<div class="field"><label>Body Req Dia</label><input class="bd"></div>'+
 '<div class="field"><label>Body Qty kg</label><input class="bq" type="number" step="0.01"></div>'+
 '<div class="field"><label>Body Count / SL</label><input class="bc"></div>'+
 '<div class="field"><label>Body M/C Dia*GG</label><input class="bm"></div>'+
 '<div class="field"><label>Body GSM</label><input class="bg" type="number" step="0.01"></div>'+
 '<div class="field"><label>Rib + Neck Tape</label><input class="rib"></div>'+
 '<div class="field"><label>Rib Req Dia</label><input class="rd"></div>'+
 '<div class="field"><label>Rib Qty kg</label><input class="rq" type="number" step="0.01"></div>'+
 '<div class="field"><label>Rib Count / SL</label><input class="rc"></div>'+
 '<div class="field"><label>Rib M/C Dia*GG</label><input class="rm"></div>'+
 '<div class="field"><label>Rib GSM</label><input class="rg" type="number" step="0.01"></div>'+
 '</div><button class="danger" onclick="this.parentElement.remove()">Remove</button>';
 $('colorList').appendChild(d);
}
function val(e,s){return e.querySelector(s)?.value?.trim()||null}
function num(e,s){let v=e.querySelector(s)?.value;return v?Number(v):null}
async function saveBooking(){
 if(!db){$('msg').textContent='Connect Supabase first.';return}
 let ref=$('ref').value.trim(), buyer=$('buyer').value;
 let cs=[...document.querySelectorAll('.color')].map(e=>({color:val(e,'.clr'),body_fabric:val(e,'.bf'),body_req_dia:val(e,'.bd'),body_qty:num(e,'.bq'),body_count_sl:val(e,'.bc'),body_mc_dia_gg:val(e,'.bm'),body_gsm:num(e,'.bg'),rib_neck_tape:val(e,'.rib'),rib_req_dia:val(e,'.rd'),rib_qty:num(e,'.rq'),rib_count_sl:val(e,'.rc'),rib_mc_dia_gg:val(e,'.rm'),rib_gsm:num(e,'.rg')})).filter(x=>x.color);
 if(!ref||!buyer||!cs.length){$('msg').textContent='Int Ref, Buyer and at least one Color are required.';return}
 $('msg').textContent='Saving...';
 try{
  let b=await db.from('buyers').select('id').eq('name',buyer).single(); if(b.error)throw b.error;
  let o=await db.from('bookings').insert({int_ref:ref,buyer_id:b.data.id,style:$('style').value||null,sample_type:$('sample').value,booking_date:$('date').value||null}).select().single();if(o.error)throw o.error;
  let c=await db.from('booking_colors').insert(cs.map(x=>({...x,booking_id:o.data.id}))).select();if(c.error)throw c.error;
  let stages=['Knitting','Grey Inspection','Dyeing','Dyeing Inspection','Finishing','Final Inspection','Delivery'];
  let s=[];c.data.forEach(x=>stages.forEach(stage=>s.push({booking_color_id:x.id,stage,status:'Pending'})));
  let z=await db.from('production_stages').insert(s);if(z.error)throw z.error;
  $('msg').textContent='✓ Booking saved successfully.';$('ref').value='';$('style').value='';$('colorList').innerHTML='';n=0;addColor();load();
 }catch(e){$('msg').textContent='Save failed: '+e.message}
}
async function load(){
 if(!db)return;
 let r=await db.from('bookings').select('id,int_ref,style,sample_type,overall_status,buyers(name),booking_colors(color)').order('created_at',{ascending:false});
 if(r.error){$('table').textContent=r.error.message;return}
 rows=r.data||[];render();
 $('total').textContent=rows.length;$('active').textContent=rows.filter(x=>x.overall_status==='Active').length;$('delivered').textContent=rows.filter(x=>x.overall_status==='Delivered').length;$('colors').textContent=rows.reduce((a,x)=>a+(x.booking_colors?.length||0),0);
}
function render(){
 let q=($('search')?.value||'').toLowerCase();
 let a=rows.filter(x=>(x.int_ref+' '+(x.style||'')+' '+(x.buyers?.name||'')+' '+(x.booking_colors||[]).map(c=>c.color).join(' ')).toLowerCase().includes(q));
 if(!a.length){$('table').innerHTML='<p class="muted">No bookings found.</p>';return}
 $('table').innerHTML='<table class="table"><tr><th>Int Ref</th><th>Buyer</th><th>Style</th><th>Colors</th><th>Sample</th><th>Status</th></tr>'+a.map(x=>'<tr><td><b>'+x.int_ref+'</b></td><td>'+(x.buyers?.name||'')+'</td><td>'+(x.style||'')+'</td><td>'+(x.booking_colors||[]).map(c=>c.color).join(', ')+'</td><td>'+x.sample_type+'</td><td>'+x.overall_status+'</td></tr>').join('')+'</table>';
}
function connect(){
 let u=$('url').value.trim(),k=$('key').value.trim();if(!u||!k){$('setmsg').textContent='Enter both values.';return}
 localStorage.setItem('spm_url',u);localStorage.setItem('spm_key',k);db=window.supabase.createClient(u,k);$('setmsg').textContent='Connected.';$('notice').style.display='none';load();
}
(function(){ $('date').value=new Date().toISOString().slice(0,10);addColor();let u=localStorage.getItem('spm_url'),k=localStorage.getItem('spm_key');if(u&&k){$('url').value=u;$('key').value=k;db=window.supabase.createClient(u,k);$('notice').style.display='none';load()}if(db)load();})();
setTimeout(async()=>{if(db){let r=await db.from('buyers').select('name').eq('active',true).order('name');if(r.data)$('buyer').innerHTML='<option value="">Select buyer</option>'+r.data.map(x=>'<option>'+x.name+'</option>').join('')}},300);
</script>
</body>
</html>
